name: Update Coding Time

on:
  schedule:
    # Every day at 12:00 AM Bangladesh time (UTC+6)
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-coding-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate coding time SVG
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["WAKATIME_API_KEY"]
          URL = "https://api.wakatime.com/api/v1/users/current/all_time_since_today"

          credentials = base64.b64encode(f"{API_KEY}:".encode()).decode()

          request = urllib.request.Request(
              URL,
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Accept": "application/json",
              }
          )

          data = None

          for attempt in range(5):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode())
                      break

              except urllib.error.HTTPError as e:
                  if e.code == 202 and attempt < 4:
                      print("WakaTime is still calculating stats. Retrying...")
                      time.sleep(30)
                  else:
                      raise

          if not data:
              raise RuntimeError("Could not get WakaTime data.")

          stats = data["data"]

          total_seconds = int(stats.get("total_seconds", 0))

          hours = total_seconds // 3600
          minutes = (total_seconds % 3600) // 60
          seconds = total_seconds % 60

          # HH:MM:SS
          digital_time = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          print("Total coding time:", digital_time)

          svg = f'''<svg width="520" height="180" viewBox="0 0 520 180"
          xmlns="http://www.w3.org/2000/svg">

            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00ff41"/>
                <stop offset="50%" stop-color="#39ff14"/>
                <stop offset="100%" stop-color="#00ff41"/>
              </linearGradient>
            </defs>

            <rect
              x="2"
              y="2"
              width="516"
              height="176"
              rx="18"
              fill="#050805"
              stroke="#14532d"
              stroke-width="2"
            />

            <rect
              x="12"
              y="12"
              width="496"
              height="156"
              rx="12"
              fill="#020402"
              stroke="#052e16"
              stroke-width="1"
            />

            <text
              x="260"
              y="52"
              text-anchor="middle"
              fill="#4ade80"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              letter-spacing="4">
              TOTAL CODING TIME
            </text>

            <text
              x="260"
              y="120"
              text-anchor="middle"
              fill="url(#green)"
              filter="url(#glow)"
              font-family="Courier New, monospace"
              font-size="57"
              font-weight="bold"
              letter-spacing="5">
              {digital_time}
            </text>

            <circle cx="50" cy="145" r="4" fill="#22c55e"/>
            <text
              x="65"
              y="151"
              fill="#166534"
              font-family="Arial, sans-serif"
              font-size="11">
              WAKATIME
            </text>

            <text
              x="470"
              y="151"
              text-anchor="end"
              fill="#166534"
              font-family="Arial, sans-serif"
              font-size="11">
              UPDATED DAILY
            </text>

          </svg>'''

          os.makedirs("assets", exist_ok=True)

          with open("assets/coding-time.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit updated coding time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/coding-time.svg

          git diff --cached --quiet || git commit -m "chore: update coding time"

          git push
